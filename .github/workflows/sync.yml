name: Sync Files

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repo (snn-brx-child-theme)
        uses: actions/checkout@v4
        with:
          path: source-repo
          fetch-depth: 0

      - name: Checkout destination repo (snn-block)
        uses: actions/checkout@v4
        with:
          repository: sinanisler/snn-block
          path: destination-repo-block
          token: ${{ secrets.SNNBRXSYNCSECRET }}

      # The files to copy are listed in .github/sync-manifest.txt. A listed file that is missing
      # from the source fails the run, so a renamed or deleted file is never skipped silently.
      - name: Copy the listed files
        run: |
          set -euo pipefail
          manifest="source-repo/.github/sync-manifest.txt"
          list="$RUNNER_TEMP/sync-list.txt"
          : > "$list"
          failed=0
          while IFS= read -r line || [ -n "$line" ]; do
            path="$(printf '%s' "$line" | sed -e 's/#.*$//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            if [ -z "$path" ]; then
              continue
            fi
            if [ ! -f "source-repo/$path" ]; then
              echo "::error file=.github/sync-manifest.txt::Listed but missing in snn-brx-child-theme: $path"
              failed=1
              continue
            fi
            mkdir -p "destination-repo-block/$(dirname "$path")"
            cp "source-repo/$path" "destination-repo-block/$path"
            echo "$path" >> "$list"
          done < "$manifest"
          echo "Listed files copied: $(wc -l < "$list")"
          exit "$failed"

      # The commit message is read from git and written to a file, never pasted into a command line,
      # so quotes, $, backticks or several lines in the message cannot break the step.
      - name: Commit and push to snn-block
        run: |
          set -euo pipefail
          src_hash="$(git -C source-repo log -1 --format=%h)"
          git -C source-repo log -1 --format=%B > "$RUNNER_TEMP/commit-body.txt"
          cd destination-repo-block
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage only the listed files, so nothing else in snn-block is touched.
          xargs -r -d '\n' -a "$RUNNER_TEMP/sync-list.txt" git add --
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          {
            echo "### Synced from snn-brx-child-theme ($src_hash)"
            echo ""
            echo '```'
            git diff --cached --stat
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          { cat "$RUNNER_TEMP/commit-body.txt"; echo; echo ": $src_hash"; } > "$RUNNER_TEMP/commit-message.txt"
          git commit -F "$RUNNER_TEMP/commit-message.txt"
          git push
