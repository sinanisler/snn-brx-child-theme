<style>.posts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; } .post { padding: 16px; }</style>
<section data-bricks="section"><div data-bricks="container"><div data-bricks="block" class="posts"><div data-bricks="block" data-loop="post" data-loop-posts-per-page="9" data-loop-orderby="title" data-loop-order="ASC"><div data-bricks="block" class="post"><h3 data-bricks="heading">{post_title}</h3><p data-bricks="text-basic">{post_excerpt}</p></div></div></div></div></section>
